<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
<!-- Formulario oculto para que Netlify detecte el pacto de la invitación de Halloween (/invitacion) -->
<form name="pacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="pacto">
  <input name="bot-field">
  <input name="nombre">
</form>
</body>
</html>
